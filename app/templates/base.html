<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DocChat — Grounded Document Intelligence Studio{% endblock %}</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'monospace'],
                    },
                    colors: {
                        studio: {
                            bg: '#FBFBFA',          /* Notion / Apple neutral warm canvas */
                            card: '#FFFFFF',        /* Pure paper white card */
                            surface: '#F4F4F5',     /* Subtle button/dock surface */
                            border: '#E4E4E7',      /* Micro 1px border */
                            muted: '#71717A',       /* Zinc-500 secondary text */
                            ink: '#18181B',         /* Zinc-900 primary high contrast ink */
                            
                            /* Dark Mode Neutral Slate / Obsidian */
                            darkBg: '#111113',      /* Deep neutral obsidian background */
                            darkCard: '#18181B',    /* Elevated neutral card */
                            darkSurface: '#222226', /* Interactive elevated surface */
                            darkBorder: '#2A2A30',  /* Crisp dark micro-border */
                            darkMuted: '#9D9DA6',   /* Muted text for dark mode */
                            darkInk: '#EDEDEF',     /* Primary off-white ink */
                        },
                        accent: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                        }
                    },
                    boxShadow: {
                        'studio-sm': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
                        'studio-card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
                        'studio-elevated': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
                        'studio-drawer': '-10px 0 35px -5px rgba(0, 0, 0, 0.08)',
                        'studio-dark-card': '0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05)',
                        'studio-dark-elevated': '0 12px 30px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06)',
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify to sanitize markdown output -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="h-full bg-studio-bg dark:bg-studio-darkBg text-studio-ink dark:text-studio-darkInk flex flex-col overflow-hidden font-sans antialiased selection:bg-neutral-900 selection:text-white dark:selection:bg-white dark:selection:text-black relative transition-colors duration-200">

    {% block content %}{% endblock %}

    <!-- Custom Modal Container for Confirmation Dialogs -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity">
        <div id="modal-content" class="bg-studio-card dark:bg-studio-darkCard border border-studio-border dark:border-studio-darkBorder rounded-2xl p-6 max-w-md w-full shadow-studio-elevated dark:shadow-studio-dark-elevated transform transition-all scale-95 opacity-0">
            <!-- Injected via JS -->
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
